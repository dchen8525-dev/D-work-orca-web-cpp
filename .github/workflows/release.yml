name: Release

# On a release tag (v0.0.2 or 0.0.2) build the portable gateway exe and the
# Linux server binary, verify their size, checksum them and upload them as
# workflow artifacts.
#
# The gateway is ONE self-contained file: orca-gateway-<tag>-windows-amd64.exe
# (static Qt + static CRT, no DLLs, no installer, no self-update). The version
# is part of the file name so releases never overwrite each other.
# The GitHub Release page itself is created with `gh release create`, so a
# workflow failure cannot silently skip the tag's release notes.
# P6 still adds the deb payload, systemd unit, static web pages and Caddy.
on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write

jobs:
  windows-gateway:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: C:/vcpkg/bincache
          key: vcpkg-${{ runner.os }}-static-qt-${{ hashFiles('scripts/setup-deps.ps1', 'cmake/Dependencies.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-static-qt-
      - name: Install vcpkg dependencies (static CRT + static Qt)
        env:
          VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg/bincache
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_DEFAULT_BINARY_CACHE)) {
            New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          }
          vcpkg install --triplet x64-windows-static `
            openssl nlohmann-json libsodium boost-beast qtbase
      - name: Configure
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          cmake -S . -B build -A x64 `
            -DORCA_BUILD_VERSION="$version" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DORCA_REQUIRE_NETWORK_DEPS=ON `
            -DORCA_REQUIRE_QT=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage + checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $stagedName = "orca-gateway-$version-windows-amd64.exe"
          Copy-Item build/gateway/Release/orca-gateway.exe $stagedName
          # Pass -D as a single quoted argument with an absolute path: an
          # unquoted relative *.exe value reached the script truncated in the
          # first CI run ("file not found: .../orca-gateway").
          $staged = Join-Path $env:GITHUB_WORKSPACE $stagedName
          cmake "-DORCA_TARGET_FILE=$staged" "-DORCA_MAX_BYTES=25165824" -P cmake/SizeReport.cmake
          (Get-FileHash $staged -Algorithm SHA256).Hash.ToLower() |
            Out-File -Encoding ascii "$stagedName.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-exe
          path: |
            orca-gateway-*-windows-amd64.exe
            orca-gateway-*-windows-amd64.exe.sha256

  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash scripts/setup-deps.sh
      - name: Build + test + size gate
        env:
          ORCA_VERSION: ${{ github.ref_name }}
        run: bash scripts/build.sh
      - name: Stage + checksum
        run: |
          cp build/server/orca-server orca-server-linux-x64
          sha256sum orca-server-linux-x64 > orca-server-linux-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: |
            orca-server-linux-x64
            orca-server-linux-x64.sha256
