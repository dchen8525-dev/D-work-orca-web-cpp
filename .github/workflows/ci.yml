name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: bash scripts/setup-deps.sh
      - name: Build + test + size gate
        run: bash scripts/build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install vcpkg dependencies (static CRT)
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows-static `
            openssl nlohmann-json libsodium boost-beast
      - name: Configure
        shell: pwsh
        # No -G: CMake picks the installed Visual Studio generator, which does
        # not require vcvars and is therefore reliable on hosted runners.
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DORCA_REQUIRE_NETWORK_DEPS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Size gate
        shell: pwsh
        run: |
          cmake -DORCA_TARGET_FILE=build/gateway/Release/orca-gateway.exe `
            -DORCA_MAX_BYTES=8388608 -P cmake/SizeReport.cmake
          cmake -DORCA_TARGET_FILE=build/server/Release/orca-server.exe `
            -DORCA_MAX_BYTES=8388608 -P cmake/SizeReport.cmake
